[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/valley_content",
    "crates/valley_sim",
    "crates/valley_render",
    "crates/valley_game",
    "crates/valley_app",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
valley_content = { path = "crates/valley_content" }
valley_sim = { path = "crates/valley_sim" }
valley_render = { path = "crates/valley_render" }
valley_game = { path = "crates/valley_game" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
roxmltree = "0.20"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
font8x8 = "0.3"
macroquad = { version = "0.4", default-features = false }
anyhow = "1"
thiserror = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
